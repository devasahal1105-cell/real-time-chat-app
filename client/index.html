<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Chat App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Login Screen -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <div class="login-logo">💬</div>
      <h1>Welcome Back</h1>
      <p>Enter your details to start chatting</p>
      <div class="input-group">
        <label>Your Name</label>
        <input 
          type="text" 
          id="usernameInput" 
          placeholder="e.g. Vradant"
          maxlength="20"
        />
      </div>
      <div class="input-group">
        <label>Room Name</label>
        <input 
          type="text" 
          id="roomInput" 
          placeholder="e.g. General, Gaming, Random"
          maxlength="20"
        />
      </div>
      <button id="joinButton">Join Room →</button>
    </div>
  </div>

  <!-- Chat Screen -->
  <div class="chat-screen" id="chatScreen" style="display:none;">
    <div class="chat-container">

      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-header">
          <div class="app-logo">💬</div>
          <h3>Chat App</h3>
        </div>
        <div class="room-info">
          <div class="room-badge">
            <span># </span><span id="currentRoom">-</span>
          </div>
          <div class="online-badge">
            🟢 <span id="onlineCount">0</span> online
          </div>
        </div>
        <div class="sidebar-section">
          <p class="section-title">MEMBERS</p>
          <div class="users-list" id="usersList"></div>
        </div>
      </div>

      <!-- Main Chat -->
      <div class="main-chat">

        <!-- Header -->
        <div class="chat-header">
          <div class="header-left">
            <h2 id="roomTitle">Room</h2>
            <p class="header-subtitle">Real-time chat room</p>
          </div>
          <div class="header-right">
            <span id="status" class="status-badge">Connecting...</span>
          </div>
        </div>

        <!-- Messages -->
        <div class="messages-area" id="messagesArea"></div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator"></div>

        <!-- Input -->
        <div class="input-area">
          <input 
            type="text" 
            id="messageInput" 
            placeholder="Type a message..."
          />
          <button id="sendButton">
            <span>Send</span>
          </button>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="app.js"></script>

</body>
</html>
