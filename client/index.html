<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatApp – Real-Time Messaging</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Login Screen -->
  <div class="login-screen" id="loginScreen" role="main">
    <div class="login-box">
      <div class="login-logo">💬</div>
      <h1>Welcome Back</h1>
      <p>Enter your details to start chatting</p>
      <div class="input-group">
        <label for="usernameInput">Your Name</label>
        <input 
          type="text" 
          id="usernameInput" 
          placeholder="e.g. Vradant"
          maxlength="20"
          autocomplete="off"
          aria-label="Enter your name"
        />
      </div>
      <div class="input-group">
        <label for="roomInput">Room Name</label>
        <input 
          type="text" 
          id="roomInput" 
          placeholder="e.g. General, Gaming, Random"
          maxlength="20"
          autocomplete="off"
          aria-label="Enter room name"
        />
      </div>
      <button id="joinButton" aria-label="Join room">Join Room →</button>
    </div>
  </div>

  <!-- Chat Screen -->
  <div class="chat-screen" id="chatScreen" style="display:none;" role="main">
    <div class="chat-container">

      <!-- Sidebar -->
      <div class="sidebar" id="sidebar" role="navigation" aria-label="Chat sidebar">
        <div class="sidebar-header">
          <div class="app-logo">💬</div>
          <h3>ChatApp</h3>
        </div>
        <div class="room-info">
          <div class="room-badge">
            <span># </span><span id="currentRoom">-</span>
          </div>
          <div class="online-badge">
            🟢 <span id="onlineCount">0</span> online
          </div>
        </div>
        <div class="sidebar-section">
          <p class="section-title">MEMBERS</p>
          <div class="users-list" id="usersList" role="list" aria-label="Online members"></div>
        </div>
      </div>

      <!-- Main Chat -->
      <div class="main-chat">

        <!-- Header -->
        <div class="chat-header">
          <div class="header-left">
            <!-- Mobile: sidebar toggle -->
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">☰</button>
            <h2 id="roomTitle">Room</h2>
            <p class="header-subtitle">Real-time chat room</p>
          </div>
          <div class="header-right">
            <span id="status" class="status-badge" role="status">Connecting...</span>
          </div>
        </div>

        <!-- Messages -->
        <div 
          class="messages-area" 
          id="messagesArea" 
          role="log" 
          aria-live="polite" 
          aria-label="Chat messages"
        ></div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator" aria-live="polite" aria-label="Typing status"></div>

        <!-- Input -->
        <div class="input-area" role="region" aria-label="Message input">
          <input 
            type="text" 
            id="messageInput" 
            placeholder="Type a message..."
            aria-label="Type a message"
            autocomplete="off"
            maxlength="500"
          />
          <button id="sendButton" aria-label="Send message" title="Send (Enter)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>

      </div>
    </div>

    <!-- Mobile sidebar overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="app.js"></script>

</body>
</html>
