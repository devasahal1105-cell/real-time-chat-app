<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Chat App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Auth Screen -->
  <div class="auth-screen" id="authScreen">
    <div class="auth-box">
      <div class="auth-logo">💬</div>
      <h1>Real-Time Chat</h1>

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="tab-btn active" id="loginTab">Login</button>
        <button class="tab-btn" id="registerTab">Register</button>
      </div>

      <!-- Error Message -->
      <div class="auth-error" id="authError"></div>

      <!-- Login Form -->
      <div class="auth-form" id="loginForm">
        <div class="input-group">
          <label>Username</label>
          <input type="text" id="loginUsername" placeholder="Enter username"/>
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Enter password"/>
        </div>
        <button class="auth-btn" id="loginBtn">Login →</button>
      </div>

      <!-- Register Form -->
      <div class="auth-form" id="registerForm" style="display:none;">
        <div class="input-group">
          <label>Username</label>
          <input type="text" id="registerUsername" placeholder="Choose username"/>
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="registerPassword" placeholder="Min 6 characters"/>
        </div>
        <button class="auth-btn" id="registerBtn">Create Account →</button>
      </div>

    </div>
  </div>

  <!-- Room Screen -->
  <div class="room-screen" id="roomScreen" style="display:none;">
    <div class="room-box">
      <div class="auth-logo">💬</div>
      <h2>Welcome, <span id="welcomeName"></span>!</h2>
      <p>Enter a room to start chatting</p>
      <div class="input-group">
        <label>Room Name</label>
        <input type="text" id="roomInput" placeholder="e.g. General, Gaming, Random"/>
      </div>
      <button class="auth-btn" id="joinRoomBtn">Join Room →</button>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
  </div>

  <!-- Chat Screen -->
  <div class="chat-screen" id="chatScreen" style="display:none;">
    <div class="chat-container">

      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-header">
          <div class="app-logo">💬</div>
          <h3>Chat App</h3>
        </div>
        <div class="room-info">
          <div class="room-badge">
            <span># </span><span id="currentRoom">-</span>
          </div>
          <div class="online-badge">
            🟢 <span id="onlineCount">0</span> online
          </div>
        </div>
        <div class="sidebar-section">
          <p class="section-title">MEMBERS</p>
          <div class="users-list" id="usersList"></div>
        </div>
        <div class="sidebar-footer">
          <div class="current-user" id="currentUser"></div>
          <button class="logout-btn-small" id="chatLogoutBtn">Logout</button>
        </div>
      </div>

      <!-- Main Chat -->
      <div class="main-chat">
        <div class="chat-header">
          <div class="header-left">
            <h2 id="roomTitle">Room</h2>
            <p class="header-subtitle">Real-time chat room</p>
          </div>
          <div class="header-right">
            <span id="status" class="status-badge">Connecting...</span>
          </div>
        </div>
        <div class="messages-area" id="messagesArea"></div>
        <div class="typing-indicator" id="typingIndicator"></div>
        <div class="input-area">
          <input type="text" id="messageInput" placeholder="Type a message..."/>
          <button id="sendButton">Send</button>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="app.js"></script>

</body>
</html>
